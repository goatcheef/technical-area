# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: crest_delivery
    status: active
    api: "<img loading=lazy decoding=async> con import.meta.glob(?url) y WebP 64/128 px"
    not: "data URIs en base64 dentro del bundle"
    adr: docs/architecture/adr-0001-carga-de-recursos.md
    reason: "88 % de la descarga inicial era base64 de escudos"
    referenced_by:
      - docs/architecture/adr-0001-carga-de-recursos.md
    added: 2026-11-22
    revised: ""
  - purpose: chunk_failure_retry
    status: active
    api: "location.reload() tras requestSave(g, menu) (LazyPage.retry)"
    not: "volver a hacer import() del mismo chunk"
    adr: docs/architecture/adr-0001-carga-de-recursos.md
    reason: "El mapa de módulos recuerda el fallo (medido en Chromium 153)"
    referenced_by:
      - docs/architecture/adr-0001-carga-de-recursos.md
      - docs/architecture/adr-0003-errores.md
    added: 2026-11-22
    revised: ""
  - purpose: idle_scheduling
    status: active
    api: "idle() de src/idle.ts"
    not: "requestIdleCallback directo"
    adr: docs/architecture/adr-0001-carga-de-recursos.md
    reason: "Safari/iOS no tiene requestIdleCallback"
    referenced_by:
      - docs/architecture/adr-0001-carga-de-recursos.md
      - docs/architecture/adr-0002-guardado.md
    added: 2026-11-22
    revised: ""
  - purpose: save_serialization
    status: active
    api: "postMessage(g) a un Worker de módulo; JSON.stringify + CompressionStream(gzip) + IndexedDB en el worker"
    not: "JSON.stringify(g) o gzip en el hilo principal"
    adr: docs/architecture/adr-0002-guardado.md
    reason: "postMessage 26 ms contra stringify 41 ms con 5,3 MB; el resto (~280 ms) sale del hilo"
    referenced_by:
      - docs/architecture/adr-0002-guardado.md
    added: 2026-11-22
    revised: ""

