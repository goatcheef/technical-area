    signature: "ToWorker { t: write, seq, slot, replace, game, meta } | { t: fault } (solo DEV); FromWorker { t: done, seq, ok, bytes | error }"
    referenced_by:
      - docs/architecture/adr-0002-guardado.md
    added: 2026-11-22
    revised: ""
  - contract: save_recovery
    status: active
    pattern: "direct_call"
    producer: "save-service"
