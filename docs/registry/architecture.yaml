# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: crest_lookup
    status: active
    pattern: "direct_call"
    producer: "ui-crests"
    consumers: [Badge]
    adr: docs/architecture/adr-0001-carga-de-recursos.md
    signature: "crestSrc(clubId: number): { src: string; srcSet: string } | null"
    referenced_by:
      - docs/architecture/adr-0001-carga-de-recursos.md
    added: 2026-11-22
    revised: ""
  - contract: static_database_access
    status: active
    pattern: "direct_call"
    producer: "engine-db"
    consumers: [engine-game, ui-start, tools-sim, tests-engine, tests-perf]
    adr: docs/architecture/adr-0001-carga-de-recursos.md
    signature: "loadDb(): Promise<Db>; getDb(): Db (lanza DbNotLoadedError antes de loadDb); dbClubs(): DbClub[]"
    referenced_by:
      - docs/architecture/adr-0001-carga-de-recursos.md
    added: 2026-11-22
    revised: ""
  - contract: page_loading
    status: active
    pattern: "direct_call"
    producer: "ui-pages"
    consumers: [ui-app, error-handling]
    adr: docs/architecture/adr-0001-carga-de-recursos.md
    signature: "type LazyPage = ComponentType & { retry(): void }; lazyPage(load): LazyPage; PAGE_COMPONENTS: Record<string, LazyPage>; prefetchPages(); retry() = reloadSafely()"
    referenced_by:
      - docs/architecture/adr-0001-carga-de-recursos.md
      - docs/architecture/adr-0003-errores.md
    added: 2026-11-22
    revised: ""
  - contract: idle_scheduling
    status: active
    pattern: "direct_call"
    producer: "src/idle.ts"
    consumers: [ui-pages, save-service]
    adr: docs/architecture/adr-0001-carga-de-recursos.md
    signature: "idle(fn, { timeout, fallbackMs }): () => void (requestIdleCallback o setTimeout)"
    referenced_by:
      - docs/architecture/adr-0001-carga-de-recursos.md
      - docs/architecture/adr-0002-guardado.md
    added: 2026-11-22
    revised: ""
  - contract: save_requests
    status: active
    pattern: "direct_call"
    producer: "save-service"
