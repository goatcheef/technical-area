    adr: docs/architecture/adr-0002-guardado.md
    signature: "requestSave(g, why: SaveReason): Promise<boolean>; noteDays(g, n); flushNow(g); Ctx.save = () => requestSave(g, action)"
    referenced_by:
      - docs/architecture/adr-0002-guardado.md
      - docs/architecture/adr-0003-errores.md
    added: 2026-11-22
    revised: ""
  - contract: save_worker_protocol
    status: active
    pattern: "rpc"
    producer: "save-service"
