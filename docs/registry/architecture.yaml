# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: crest_base64_in_bundle
    status: active
    description: "Ningún archivo de src/ importa crests.json ni contiene imágenes en base64; Badge obtiene la imagen solo de crestSrc"
    why: "Era el 88 % de la descarga inicial (2,70 MB brotli)"
    adr: docs/architecture/adr-0001-carga-de-recursos.md
    added: 2026-11-22
  - pattern: module_level_db_read
    status: active
    description: "Ningún módulo lee la base en el nivel de módulo ni antes de loadDb(); toda lectura pasa por getDb() dentro de una función"
    why: "La base llega como chunk dinámico; una lectura temprana da un arreglo vacío o lanza"
    adr: docs/architecture/adr-0001-carga-de-recursos.md
    added: 2026-11-22
  - pattern: cross_origin_runtime_resources
    status: active
    description: "index.html y la app no piden recursos de otros dominios en tiempo de ejecución (fuentes propias)"
    why: "La hoja de Google Fonts bloqueaba el render y es una salida de red no deseada"
    adr: docs/architecture/adr-0001-carga-de-recursos.md
    added: 2026-11-22
  - pattern: chunk_reimport_retry
    status: active
    description: "Reintentar una pantalla diferida nunca vuelve a hacer import(); LazyPage.retry guarda y recarga"
    why: "El navegador recuerda el fallo del módulo"
    adr: docs/architecture/adr-0001-carga-de-recursos.md
    added: 2026-11-22
  - pattern: direct_request_idle_callback
    status: active
    description: "Nada llama a requestIdleCallback directamente; se usa idle()"
    why: "No existe en Safari/iOS: el guardado no correría"
    adr: docs/architecture/adr-0001-carga-de-recursos.md
    added: 2026-11-22
  - pattern: storage_outside_save_service
    status: active
    description: "Ningún módulo fuera de src/save/ llama a indexedDB ni a JSON.stringify(g) para guardar la partida"
    why: "El anillo, el puntero atómico, la fusión y el bloqueo solo valen si hay una sola puerta"
    adr: docs/architecture/adr-0002-guardado.md
    added: 2026-11-22
  - pattern: concurrent_save_writes
    status: active
    description: "Nunca más de una escritura de la partida en vuelo; los pedidos se fusionan"
    why: "Dos copias de 5 MB a la vez y escrituras desordenadas pueden dejar el puntero en una copia vieja"
    adr: docs/architecture/adr-0002-guardado.md
    added: 2026-11-22
  - pattern: overwrite_head_slot
    status: active
    description: "Nunca se sobrescribe la ranura a la que apunta head, ni se borra el anillo antes de escribir una partida nueva o importada"
    why: "Siempre tiene que quedar una copia buena si la escritura muere a mitad"
    adr: docs/architecture/adr-0002-guardado.md
    added: 2026-11-22
  - pattern: save_skip_by_refresh_only
    status: active
    description: "Un requestSave que no es hidden ni days nunca se saltea por no haber habido refresh()"
    why: "Varias pantallas mutan y guardan sin refresh(): se perderían decisiones"
    adr: docs/architecture/adr-0002-guardado.md
    added: 2026-11-22
  - pattern: game_shape_change_without_version
    status: active
    description: "Un cambio de forma de Game sin subir GAME_VERSION y sin un paso en migrateGame"
    why: "Las partidas guardadas se leerían mal o se descartarían"
    adr: docs/architecture/adr-0002-guardado.md
    added: 2026-11-22
  - pattern: save_after_engine_exception
    status: active
    description: "Tras una excepción del motor o fuera del dibujo no se guarda ni se exporta el estado en memoria hasta cargar uno del disco"
    why: "Un estado a medio mutar quedaría guardado para siempre"
    adr: docs/architecture/adr-0003-errores.md
    added: 2026-11-22
  - pattern: per_action_state_clone
    status: active
    description: "No se toma structuredClone del Game como respaldo antes de cada acción"
    why: "40-76 ms por clic en desktop y ~4× en celular"
    adr: docs/architecture/adr-0003-errores.md
    added: 2026-11-22
  - pattern: auto_reload_on_error
    status: active
    description: "Ninguna recarga ni navegación automática tras un error"
    why: "Un error que se repite al cargar entra en bucle y se pierde el detalle"
    adr: docs/architecture/adr-0003-errores.md
    added: 2026-11-22
  - pattern: network_error_telemetry
    status: active
    description: "El registro de errores nunca hace pedidos de red ni guarda datos personales"
    why: "Privacidad (CLAUDE.md): el usuario copia el detalle a mano"
    adr: docs/architecture/adr-0003-errores.md
    added: 2026-11-22
  - pattern: page_without_error_boundary
    status: active
    description: "Ninguna página de App.tsx sin su ErrorBoundary scope=page"
    why: "Un error de dibujo dejaría la pantalla en blanco"
    adr: docs/architecture/adr-0003-errores.md
    added: 2026-11-22
  - pattern: unguarded_engine_call_in_effect
    status: active
    description: "Ninguna llamada al motor desde un useEffect o un useMemo sin guarded"
    why: "La frontera tomaría un error a medio mutar por un error de dibujo y seguiría guardando"
    adr: docs/architecture/adr-0003-errores.md
    added: 2026-11-22

